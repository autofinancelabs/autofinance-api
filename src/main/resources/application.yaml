spring:
  application:
    name: autofinance-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  jpa:
    show-sql: false
    hibernate:
      naming:
        physical-strategy: com.autofinance.api.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  error:
    include-stacktrace: never
    include-message: never

scalar:
  enabled: true
  theme: kepler

documentation:
  application:
    title: @project.name@
    description: @project.description@
    version: @project.version@
  server:
    url: ${SERVER_URL:http://localhost:${AUTOFINANCE_SERVER_PORT:8585}}