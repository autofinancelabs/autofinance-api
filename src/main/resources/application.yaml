spring:
  application:
    name: autofinance-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  web:
    locale: en
    locale-resolver: fixed
    error:
      include-stacktrace: never
      include-message: never
  jpa:
    show-sql: false
    hibernate:
      naming:
        physical-strategy: com.autofinance.api.shared.infrastructure.persistence.jpa.configuration.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

security:
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-please-0123456789-abcdef}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}

scalar:
  enabled: true
  theme: blue_planet
  operation-sorter: method
  dark-mode: true
  hide-client-button: true
  show-developer-tools: never

documentation:
  application:
    title: @project.name@
    description: @project.description@
    version: @project.version@
  server:
    url: ${SERVER_URL:http://localhost:${AUTOFINANCE_SERVER_PORT:8585}}